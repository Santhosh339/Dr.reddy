<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codman CERTAS Tool Kit | Dr. Reddy's</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="mobile-container">

    <!-- ── HEADER ── -->
    <div class="header">
      <div class="logo-integra">
        <span class="integra-cross">&#10010;</span>
        <span class="integra-word">INTEGRA</span>
      </div>
      <div class="logo-drreddy">
        <span class="drreddy-word">Dr.Reddy's</span>
        <span class="drreddy-grape">&#127815;</span>
      </div>
    </div>

    <!-- ── BODY ── -->
    <div class="body-area">

      <!-- Product Logo Box -->
      <div class="product-logo-box">
        <span class="product-logo-placeholder">Logo</span>
      </div>

      <!-- IFU -->
      <p class="section-label">Click here for user manual</p>
      <a href="codman-vpv-system.pdf" target="_blank" class="pill-btn" id="ifu-link">
        <div class="pill-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="26" height="26">
            <path fill="#5a1e96" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 1.5L18.5 9H13V3.5zM6 20V4h5v7h7v9H6z"/>
            <circle cx="12" cy="14" r="1" fill="#5a1e96"/>
            <path d="M12 16v2.5" stroke="#5a1e96" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="pill-label">Instructions for use (IFU)</div>
      </a>

      <!-- Training Video -->
      <p class="section-label" style="margin-top:16px;">Click here for programming &amp;<br />handling training video</p>
      <a href="#" class="pill-btn" id="training-link" onclick="openVideoModal(event)">
        <div class="pill-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="26" height="26">
            <rect x="2" y="4" width="15" height="13" rx="2" fill="none" stroke="#5a1e96" stroke-width="1.6"/>
            <polygon points="8,7.5 14,10.5 8,13.5" fill="#5a1e96"/>
            <path d="M19 8l2-2v9l-2-2V8z" fill="#5a1e96"/>
          </svg>
        </div>
        <div class="pill-label">Programming &amp; handling<br />training video</div>
      </a>

    </div>

    <!-- ── DISCLAIMER ── -->
    <div class="disclaimer-box">
      <p class="disclaimer-text">Disclaimer:</p>
    </div>

  </div>

  <!-- ── VIDEO MODAL ── -->
  <div class="video-modal" id="videoModal" onclick="handleModalClick(event)">
    <div class="video-modal-box" id="videoModalBox">
      <button class="video-close-btn" onclick="closeVideoModal()" aria-label="Close">&#10005;</button>
      <video id="mainVideo" class="video-player" controls playsinline>
        <source src="Codman-surgical.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
    </div>
  </div>

  <script>
    const modal    = document.getElementById('videoModal');
    const video    = document.getElementById('mainVideo');
    const modalBox = document.getElementById('videoModalBox');

    function openVideoModal(e) {
      e.preventDefault();
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
      video.play();
    }

    function closeVideoModal() {
      modal.classList.remove('active');
      video.pause();
      video.currentTime = 0;
      document.body.style.overflow = '';
    }

    function handleModalClick(e) {
      if (e.target === modal) closeVideoModal();
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeVideoModal();
    });
  </script>

</body>
</html>
